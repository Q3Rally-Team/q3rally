//
// Q3Rally default key bindings
//
// Executed on first start (before q3config.cfg exists).
// Keep in sync with the defaults in engine/code/q3_ui/ui_rally_controls.c
// (g_bindings[], "Reset defaults" in Config -> Controls).
//

// Driving
bind w "+forward"
bind UPARROW "+forward"
bind s "+back"
bind DOWNARROW "+back"
bind a "+left"
bind LEFTARROW "+left"
bind d "+right"
bind RIGHTARROW "+right"
bind SPACE "+button14"
bind SHIFT "+speed"
bind PGUP "gearUp"
bind PGDN "gearDown"
bind x "+moveup"
bind c "+movedown"
bind h "+button3"
bind l "headlights"
bind v "nextcamera"

// Combat
bind CTRL "+attack"
bind MOUSE2 "+button5"
bind KP_INS "+button12"
bind r "dropWeapon"
bind [ "weapprev"
bind ] "weapnext"
bind MWHEELUP "weapprev"
bind MWHEELDOWN "weapnext"
bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind 4 "weapon 4"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"
bind 8 "weapon 8"
bind 9 "weapon 9"
bind 0 "weapon 10"
bind ENTER "+button2"
bind g "drop"

// View & interface
bind TAB "+scores"
bind q "+hud"
bind MOUSE3 "+zoom"
bind / "+mlook"
bind END "centerview"
bind t "messagemode"
bind y "messagemode2"
bind i "messagemode3"
bind o "messagemode4"
bind z "record"
bind u "stoprecord"

// Jukebox
bind F5 "jukebox_play"
bind F6 "jukebox_next"
bind F7 "jukebox_prev"
bind F8 "jukebox_rescan"
bind F9 "jukebox_shuffle_toggle"
bind F10 "jukebox_repeat_cycle"
