// Q3Rally default engine sound (used by every car without its own engine.cfg)
// Loops cut from the former sidepipe set to whole repeating patterns
// on <file> <fundamental frequency in Hz>

on      on_00.wav   36.54
on      on_01.wav   42.53
on      on_02.wav   48.63
on      on_03.wav   54.61
on      on_04.wav   60.36
on      on_05.wav   66.56
on      on_06.wav   72.68
on      on_07.wav   78.67
on      on_08.wav   84.60
on      on_09.wav   89.27
on      on_10.wav   95.28

// target frequency at normalized rpm 0 and 1 (linear)
curve   36.54  95.28

// loudness: idle, max, curve exponent, share when off throttle
volume  idle 0.35  max 1.0  gamma 1.3  off 0.6

// low-pass over the engine loops: cutoff in Hz off throttle / on throttle (off 0 = no filter)
filter  off 1600  on 9000

// straight-cut gearbox whine: level (0 = off), mesh frequency = rpm / 60 * teeth
whine   level 0.02  teeth 22

// turbo whistle, only for turbo cars: level, pitch at full boost in Hz, spool time in s
// turbo   level 0.05  pitch 3200  spool 0.35

// event sounds are picked up by file name, no entry needed here:
//   pop1.wav .. pop4.wav    backfires when lifting off at high rpm
//   shift1.wav, shift2.wav  gear change clack
// pop1..4 are synthetic placeholders; sources of all files: CREDITS.txt
