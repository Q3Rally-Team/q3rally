g_gametype 23
capturelimit 5
timelimit 5

sv_maxClients 8
sv_hostname "Q3R Autoball Server"
g_motd "Kick it in!"

bot_enable 1
bot_minplayers 6

// Autoball tuning (defaults shown)
g_autoballKickoffDelay 3
g_autoballGoalDelay 4
g_autoballStartTurbo 5000
g_autoballDemoSpeed 110
g_autoballWeapons 0

// Mutators (reset every map unless set here)
g_autoballBalls 1
g_autoballBallScale 1
g_autoballBallGravity 1

// Balance data for tools/autoball/analyze_log.py
g_log games.log
g_autoballStats 1

// Ladder reporting
sv_ladderEnabled 1
sv_ladderUrl "https://ladder.q3rally.com/index.php/matches"
sv_ladderApiKey ""

sv_maxRate 25000
sv_dlRate 1000

set d1 "map q3r_autoball_test ; set nextmap vstr d1"
vstr d1
