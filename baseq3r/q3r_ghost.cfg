// Q3Rally Ghost Race server
//
// Solo laps against a ghost, no AI drivers. The game rejects bots in this
// mode (addbot and bot_minplayers have no effect) and does not submit ladder
// results. Every finished lap is still recorded as a ghost file and feeds the
// bot racing lines of the other race modes.
//
// Base ghost for clients ("Server base" playback) and bot routes are read
// from ghosts/<map>_tl<length>_rev<0|1>_*.ghost on this server.

g_gametype 8
timelimit 10
laplimit 3

sv_maxClients 8
sv_hostname "Q3R Ghost Race Server"
g_motd "Beat your ghost!"

bot_enable 0
bot_minplayers 0

// Ghost races are never reported to the ladder
sv_ladderEnabled 0

sv_maxRate 25000
sv_dlRate 1000

set d1 "map q3r_country01 ; set nextmap vstr d2"
set d2 "map q3r_dirtyfun ; set nextmap vstr d3"
set d3 "map q3r_downtown ; set nextmap vstr d4"
set d4 "map q3r_lavafalls ; set nextmap vstr d5"
set d5 "map q3r_nightcity ; set nextmap vstr d6"
set d6 "map q3r_ridgeracer ; set nextmap vstr d7"
set d7 "map q3r_sk1 ; set nextmap vstr d8"
set d8 "map q3r_valley ; set nextmap vstr d1"
vstr d1
