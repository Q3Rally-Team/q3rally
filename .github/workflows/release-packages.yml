name: Release packages
on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Published base version for incremental updates (empty: full packages only)'
        type: string
        default: '0.8.1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read release version from source
        id: version
        shell: python
        env:
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          import os, pathlib, re
          source = pathlib.Path('engine/Makefile').read_text()
          version = re.search(r'^VERSION\s*=\s*v?(\d+\.\d+(?:\.\d+)?)\s*$', source, re.M).group(1)
          base = os.environ.get('BASE_VERSION', '')
          if base and not re.fullmatch(r'\d+\.\d+(?:\.\d+)?[a-z]?', base):
              raise ValueError('Invalid base version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\n')
              stream.write(f'base_version={base}\n')
      - run: sudo apt-get update && sudo apt-get install -y gcc php-cli
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest -r launcher/requirements-publishing.txt
      - run: python -m pytest -q tests
  packages:
    needs: tests
    env:
      GAME_VERSION: ${{ needs.tests.outputs.version }}
      BASE_VERSION: ${{ needs.tests.outputs.base_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x86_64, arch: x86_64, platform: mingw32, msystem: MINGW64, prefix: mingw-w64-x86_64}
          - {runner: windows-2022, target: windows-x86, arch: x86, platform: mingw32, msystem: MINGW32, prefix: mingw-w64-i686}
          - {runner: ubuntu-22.04, target: linux-x86_64, arch: x86_64, platform: linux}
          - {runner: ubuntu-22.04, target: linux-x86, arch: x86, platform: linux}
          - {runner: macos-15-intel, target: macos-x86_64, arch: x86_64, platform: darwin}
          - {runner: macos-14, target: macos-arm64, arch: arm64, platform: darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r launcher/requirements.txt
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          suppress-deprecation-warnings: ${{ matrix.msystem == 'MINGW32' && 'msystem-mingw32' || 'msystem-mingw64' }}
          update: true
          install: base-devel git make zip ${{ matrix.prefix }}-gcc ${{ matrix.prefix }}-binutils ${{ matrix.prefix }}-cmake ${{ matrix.prefix }}-ninja
      - if: runner.os == 'Linux'
        name: Install native Linux build dependencies
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib pkg-config libsdl2-dev:i386 libcurl4-openssl-dev:i386
          else
            sudo apt-get update
            sudo apt-get install -y pkg-config libsdl2-dev libcurl4-openssl-dev
          fi
      - if: runner.os == 'Windows'
        name: Build Windows with static HTTPS support
        shell: msys2 {0}
        run: |
          sh engine/misc/build-curl-mingw.sh ${{ matrix.arch }} "$PWD/curl-${{ matrix.arch }}"
          make release -j4 -C engine PLATFORM=mingw32 ARCH=${{ matrix.arch }} FULLBINEXT=.${{ matrix.arch }}.exe VERSION=v${{ env.GAME_VERSION }} WINDRES=windres USE_CURL=1 USE_CURL_DLOPEN=0 CURL_PREFIX="$PWD/curl-${{ matrix.arch }}" BUILD_GAME_SO=0 BUILD_GAME_QVM=1
      - if: runner.os == 'Linux'
        name: Build Linux
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then
            export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          fi
          make release -j4 -C engine ARCH=${{ matrix.arch }} VERSION=v${{ env.GAME_VERSION }} USE_CURL=1 USE_CURL_DLOPEN=0 BUILD_GAME_SO=0 BUILD_GAME_QVM=1
      - if: runner.os == 'macOS'
        name: Build native Mac app
        run: |
          make release -j4 -C engine PLATFORM=darwin ARCH=${{ matrix.arch }} VERSION=v${{ env.GAME_VERSION }} USE_CURL=1 USE_CURL_DLOPEN=1 BUILD_GAME_SO=1 BUILD_GAME_QVM=1
          cd engine
          bash make-macosx-app.sh release ${{ matrix.arch }}
      - name: Audit and package exact native build
        run: python make_release.py --version ${{ env.GAME_VERSION }} --target ${{ matrix.target }}=engine/build/release-${{ matrix.platform }}-${{ matrix.arch }} --output output/game-release --report output/game-release-audit.json
      - name: Verify signed installation and native dedicated server from package
        if: env.BASE_VERSION == ''
        run: python tools/validate_game_package.py --release-index output/game-release/release.json --output output/game-release-validation
      - name: Fetch published base and build incremental update
        if: env.BASE_VERSION != ''
        run: |
          python tools/fetch_release_base.py --version "${{ env.BASE_VERSION }}" --target ${{ matrix.target }} --output output/base-release
          python tools/make_incremental_update.py --base-index output/base-release/release.json --release-index output/game-release/release.json --output output/game-release
      - name: Verify full and incremental installs plus native dedicated server
        if: env.BASE_VERSION != ''
        run: python tools/validate_game_package.py --release-index output/game-release/release.json --output output/game-release-validation --base-index output/base-release/release.json --update-index output/game-release/updates.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q3rally-${{ env.GAME_VERSION }}-${{ matrix.target }}
          compression-level: 0
          path: |
            output/game-release/*.zip
            output/game-release/release.json
            output/game-release/updates.json
            output/game-release/SHA256SUMS
            output/game-release-audit.json
            output/game-release-validation/result.json
            output/game-release-validation/dedicated/**
            output/game-release-validation/offline-registration/**
