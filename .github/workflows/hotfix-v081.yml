name: Q3Rally v0.8.1 packages
on:
  workflow_dispatch:
  push:
    branches: ['codex/v081-offline-registration']
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc php-cli
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest -r launcher/requirements-publishing.txt
      - run: python -m pytest -q tests
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x86_64, arch: x86_64, platform: mingw32, msystem: MINGW64, prefix: mingw-w64-x86_64}
          - {runner: windows-2022, target: windows-x86, arch: x86, platform: mingw32, msystem: MINGW32, prefix: mingw-w64-i686}
          - {runner: ubuntu-22.04, target: linux-x86_64, arch: x86_64, platform: linux}
          - {runner: ubuntu-22.04, target: linux-x86, arch: x86, platform: linux}
          - {runner: macos-15-intel, target: macos-x86_64, arch: x86_64, platform: darwin}
          - {runner: macos-14, target: macos-arm64, arch: arm64, platform: darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r launcher/requirements.txt
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          suppress-deprecation-warnings: ${{ matrix.msystem == 'MINGW32' && 'msystem-mingw32' || 'msystem-mingw64' }}
          update: true
          install: base-devel git make zip ${{ matrix.prefix }}-gcc ${{ matrix.prefix }}-binutils ${{ matrix.prefix }}-cmake ${{ matrix.prefix }}-ninja
      - if: runner.os == 'Linux'
        name: Install native Linux build dependencies
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib pkg-config libsdl2-dev:i386 libcurl4-openssl-dev:i386
          else
            sudo apt-get update
            sudo apt-get install -y pkg-config libsdl2-dev libcurl4-openssl-dev
          fi
      - if: runner.os == 'Windows'
        name: Build Windows with static HTTPS support
        shell: msys2 {0}
        run: |
          sh engine/misc/build-curl-mingw.sh ${{ matrix.arch }} "$PWD/curl-${{ matrix.arch }}"
          make release -j4 -C engine PLATFORM=mingw32 ARCH=${{ matrix.arch }} FULLBINEXT=.${{ matrix.arch }}.exe VERSION=v0.8.1 WINDRES=windres USE_CURL=1 USE_CURL_DLOPEN=0 CURL_PREFIX="$PWD/curl-${{ matrix.arch }}" BUILD_GAME_SO=0 BUILD_GAME_QVM=1
      - if: runner.os == 'Linux'
        name: Build Linux
        run: |
          if [ '${{ matrix.arch }}' = x86 ]; then
            export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          fi
          make release -j4 -C engine ARCH=${{ matrix.arch }} VERSION=v0.8.1 USE_CURL=1 USE_CURL_DLOPEN=0 BUILD_GAME_SO=0 BUILD_GAME_QVM=1
      - if: runner.os == 'macOS'
        name: Build native Mac app
        run: |
          make release -j4 -C engine PLATFORM=darwin ARCH=${{ matrix.arch }} VERSION=v0.8.1 USE_CURL=1 USE_CURL_DLOPEN=1 BUILD_GAME_SO=1 BUILD_GAME_QVM=1
          cd engine
          bash make-macosx-app.sh release ${{ matrix.arch }}
      - name: Audit and package exact native build
        run: python make_release.py --version 0.8.1 --target ${{ matrix.target }}=engine/build/release-${{ matrix.platform }}-${{ matrix.arch }} --output output/v0.8.1 --report output/v0.8.1-audit.json
      - name: Verify signed installation and native dedicated server from package
        run: python tools/validate_game_package.py --release-index output/v0.8.1/release.json --output output/v0.8.1-validation
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v0.8.1-${{ matrix.target }}
          compression-level: 0
          path: |
            output/v0.8.1/*.zip
            output/v0.8.1/release.json
            output/v0.8.1/SHA256SUMS
            output/v0.8.1-audit.json
            output/v0.8.1-validation/result.json
            output/v0.8.1-validation/dedicated/**
            output/v0.8.1-validation/offline-registration/**
