name: Launcher
on:
  workflow_dispatch:
  push:
    branches: ['codex/launcher-*']
    paths: ['launcher/**', 'run_launcher.py', 'tools/*launcher*.py', 'tests/test_launcher*.py', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'run_launcher.py', 'tools/*launcher*.py', 'tests/test_launcher.py', '.github/workflows/launcher.yml']
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: windows-x86_64
          - os: windows-latest
            arch: x86
            target: windows-x86
          - os: ubuntu-22.04
            arch: x64
            target: linux-x86_64
          - os: macos-15-intel
            arch: x64
            target: macos-x86_64
          - os: macos-14
            arch: arm64
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install --no-cache-dir -r launcher/requirements.txt pyinstaller==6.22.3
      - run: python -c "import struct, platform; print(platform.platform(), struct.calcsize('P') * 8)"
      - run: python -m unittest discover -s tests -p test_launcher.py -v
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -p test_launcher_ui.py -v
        env:
          Q3RALLY_TEST_GUI: '1'
      - run: python tools/build_launcher.py --output output/launcher-ci
      - if: runner.os != 'Linux'
        run: python tools/validate_launcher_package.py --release-index output/launcher-ci/release.json --output output/launcher-package-check
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tools/validate_launcher_package.py --release-index output/launcher-ci/release.json --output output/launcher-package-check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: launcher-${{ matrix.target }}
          path: |
            output/launcher-ci/*.zip
            output/launcher-ci/release.json
            output/launcher-package-check/result.json
            output/launcher-package-check/gui.log
            output/launcher-package-check/**/logs/*.log
  linux-x86:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with native 32-bit Debian userspace
        run: |
          docker run --rm --platform linux/386 --shm-size=512m \
            -v "$PWD:/work" -w /work i386/debian:bookworm bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-venv python3-dev python3-tk build-essential libffi-dev binutils xvfb xauth ca-certificates fontconfig
              python3 -m venv /tmp/launcher-env
              . /tmp/launcher-env/bin/activate
              python -m pip install --no-cache-dir -r launcher/requirements.txt pyinstaller==6.22.3
              python -c "import struct; assert struct.calcsize(\"P\") == 4"
              python -m unittest discover -s tests -p test_launcher.py -v
              Q3RALLY_TEST_GUI=1 xvfb-run -a python -m unittest discover -s tests -p test_launcher_ui.py -v
              python tools/build_launcher.py --output output/launcher-ci-linux-x86
              xvfb-run -a python tools/validate_launcher_package.py --release-index output/launcher-ci-linux-x86/release.json --output output/launcher-package-check-linux-x86
            '
      - name: Make container diagnostics readable by the artifact uploader
        if: always()
        run: sudo chmod -R a+rX output/launcher-ci-linux-x86 output/launcher-package-check-linux-x86
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: launcher-linux-x86
          path: |
            output/launcher-ci-linux-x86/*.zip
            output/launcher-ci-linux-x86/release.json
            output/launcher-package-check-linux-x86/result.json
            output/launcher-package-check-linux-x86/**/logs/*.log
  publishing:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r launcher/requirements-publishing.txt
      - run: python -m unittest discover -s tests -p test_launcher.py -v
