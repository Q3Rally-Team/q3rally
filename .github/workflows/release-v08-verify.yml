name: Q3Rally v0.8 package verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/release-v08-package-validation']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x86_64}
          - {runner: windows-2022, target: windows-x86}
          - {runner: ubuntu-22.04, target: linux-x86_64}
          - {runner: ubuntu-22.04, target: linux-x86}
          - {runner: macos-15-intel, target: macos-x86_64}
          - {runner: macos-14, target: macos-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r launcher/requirements.txt
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = linux-x86 ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y libsdl2-2.0-0:i386 libcurl4:i386 libgl1:i386
          else
            sudo apt-get update
            sudo apt-get install -y libsdl2-2.0-0 libcurl4 libgl1
          fi
      - name: Download the unchanged native package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '41546747146'
          ARTIFACT: v0.8-${{ matrix.target }}
        run: |
          for attempt in {1..40}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[].name' | grep -Fx "$ARTIFACT"; then
              gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir input
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Verify native installed release
        run: python tools/validate_game_package.py --release-index input/v0.8/release.json --output output/validation
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validated-v0.8-${{ matrix.target }}
          path: |
            output/validation/result.json
            output/validation/dedicated/**
