name: Q3Rally v0.8 package verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/release-v08-package-validation']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x86_64}
          - {runner: windows-2022, target: windows-x86}
          - {runner: ubuntu-22.04, target: linux-x86_64}
          - {runner: ubuntu-22.04, target: linux-x86}
          - {runner: macos-15-intel, target: macos-x86_64}
          - {runner: macos-14, target: macos-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r launcher/requirements.txt
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = linux-x86 ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y libsdl2-2.0-0:i386 libcurl4:i386 libgl1:i386
          else
            sudo apt-get update
            sudo apt-get install -y libsdl2-2.0-0 libcurl4 libgl1
          fi
      - name: Download the unchanged native package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '41546747146'
          ARTIFACT: v0.8-${{ matrix.target }}
        run: |
          for attempt in {1..40}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[].name' | grep -Fx "$ARTIFACT"; then
              gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir input
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Verify native installed release
        run: python tools/validate_game_package.py --release-index input/v0.8/release.json --output output/validation
      - if: failure() && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gdb
      - if: failure() && runner.os == 'Windows'
        name: Capture native Windows startup backtrace
        shell: msys2 {0}
        run: |
          for attempt in {1..20}; do
            gdb --batch -ex 'set pagination off' -ex "cd $PWD/output/validation/data/versions/0.8-${{ matrix.target }}" -ex run -ex bt --args \
              "$PWD/output/validation/data/versions/0.8-${{ matrix.target }}/q3rally-server.${{ matrix.target == 'windows-x86' && 'x86' || 'x86_64' }}.exe" \
              +set fs_basepath "$PWD/output/validation/data/versions/0.8-${{ matrix.target }}" \
              +set vm_game 2 +set fs_homepath "$PWD/output/validation/debug-home-$attempt" \
              +set dedicated 1 +set net_ip 127.0.0.1 +set net_enabled 0 +set net_port 29101 +set logfile 2 +quit \
              > "output/validation/gdb-$attempt.txt" 2>&1 || true
            cat "output/validation/gdb-$attempt.txt" >> output/validation/gdb.txt
            if grep -E 'received signal|SIGSEGV|ACCESS_VIOLATION' "output/validation/gdb-$attempt.txt"; then break; fi
          done
          cat output/validation/gdb.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validated-v0.8-${{ matrix.target }}
          path: |
            output/validation/result.json
            output/validation/gdb.txt
            output/validation/dedicated/**
